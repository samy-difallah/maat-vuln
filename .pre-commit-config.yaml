# Mirrors the CI lint job. Hooks run the venv's tools so that versions come
# from pyproject.toml, as in CI: activate the venv before committing.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: system
        types_or: [python, pyi]
      - id: lint-imports
        name: lint-imports
        entry: lint-imports
        language: system
        files: (\.py|pyproject\.toml)$
        pass_filenames: false
      - id: schema-drift
        name: JSON Schema drift
        entry: python scripts/generate_schemas.py --check
        language: system
        files: ^(maat_vuln/models/|schemas/|scripts/generate_schemas\.py)
        pass_filenames: false
      - id: conventional-commit
        name: Conventional Commits message
        entry: '\A(Merge |(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^\n]{1,100}$)'
        language: pygrep
        args: [--multiline, --negate]
        stages: [commit-msg]
