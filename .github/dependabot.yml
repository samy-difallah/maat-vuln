# Actions: version updates, grouped. pip: security updates only, since users'
# installs pick the versions; a fix raises a minimum in pyproject.toml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # 0 turns version updates off; security updates still use this entry.
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope
  # docs/examples/project is vulnerable on purpose: its scans are committed
  # in docs/examples/inputs/, so its dependencies must never be bumped.
  - package-ecosystem: pip
    directory: /docs/examples/project
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: gomod
    directory: /docs/examples/project
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: gradle
    directory: /docs/examples/project
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
