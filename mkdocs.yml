site_name: Maat
site_description: Exploitation-driven vulnerability prioritization with CISA KEV and FIRST EPSS, explained and reproducible.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://maat-vuln.readthedocs.io/en/stable/"]
repo_url: https://github.com/samy-difallah/maat-vuln
repo_name: samy-difallah/maat-vuln
edit_uri: edit/develop/docs/
copyright: Apache-2.0

theme:
  name: material
  # Keeps the Material for MkDocs look; Zensical defaults to `modern`.
  variant: classic
  logo: assets/feather.svg
  favicon: assets/feather.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # Pulls CHANGELOG.md from the repository root, so it is not copied.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            # Pydantic fields have no docstrings; show them with their types.
            show_if_no_docstring: true
            show_labels: false
            filters: ["!^_", "!^model_"]

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Priorities and policy: concepts/policy.md
      - Signals and identifiers: concepts/signals.md
      - Snapshots: concepts/snapshots.md
  - Guides:
      - Inputs: guides/inputs.md
      - SCA tools: guides/sca-tools.md
      - Configuration: guides/configuration.md
      - Python library: guides/library.md
      - Examples: examples/README.md
  - Reference:
      - Command line: reference/cli.md
      - JSON output: reference/json.md
      - Python API: reference/api.md
  - Project:
      - Design document: design.md
      - Changelog: changelog.md
      - Contributing: https://github.com/samy-difallah/maat-vuln/blob/main/CONTRIBUTING.md
      - Security policy: https://github.com/samy-difallah/maat-vuln/blob/main/SECURITY.md
