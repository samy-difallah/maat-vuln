# Read the Docs build of the documentation site, with Zensical from
# mkdocs.yml.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Read the Docs has no native Zensical builder: build, then publish.
    build:
      html:
        - zensical build --strict
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
