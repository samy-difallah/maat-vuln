# Read the Docs build of the documentation site, with Zensical from
# mkdocs.yml.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # Read the Docs has no native Zensical builder, so it runs none of its
  # default jobs (python.install included): install, build, then publish.
  jobs:
    install:
      - pip install ".[docs]"
    build:
      html:
        - zensical build --strict
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
