[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maat-vuln"
version = "0.1.0"
description = "Exploitation-driven vulnerability prioritization with CISA KEV and FIRST EPSS, explained and reproducible."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Samy DIFALLAH", email = "samy.dflh@gmail.com" }]
keywords = ["vulnerability", "prioritization", "kev", "epss", "cvss", "psirt"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
]
lint = [
    "ruff>=0.17",
    "import-linter>=2.15",
    "pre-commit>=4.7",
]
release = [
    "git-cliff>=2.14",
    "build>=1.6",
]
dev = ["maat-vuln[test,lint,release]"]

[project.urls]
Repository = "https://github.com/samy-difallah/maat-vuln"
Issues = "https://github.com/samy-difallah/maat-vuln/issues"

[tool.hatch.build.targets.wheel]
packages = ["maat_vuln"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "ANN",     # type annotations
    "UP",      # pyupgrade (PEP 585/604 generics and unions)
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "PT",      # flake8-pytest-style
    "RUF",     # ruff-specific
    "T20",     # no print: the library never writes to the terminal
    "PLR2004", # thresholds are named constants, not inline literals
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.importlinter]
root_package = "maat_vuln"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--cov=maat_vuln",
    "--cov-report=term-missing",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["maat_vuln"]

[tool.coverage.report]
fail_under = 80
show_missing = true
