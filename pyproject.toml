[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maat-vuln"
version = "0.1.0"
description = "Exploitation-driven vulnerability prioritization with CISA KEV and FIRST EPSS, explained and reproducible."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Samy DIFALLAH", email = "samy.dflh@gmail.com" }]
keywords = ["vulnerability", "prioritization", "kev", "epss", "cvss", "psirt"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28",
    "platformdirs>=4.13",
    "pydantic>=2.14",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
]
lint = [
    "ruff>=0.17",
    "import-linter>=2.15",
    "pre-commit>=4.7",
]
release = [
    "git-cliff>=2.14",
    "build>=1.6",
]
dev = ["maat-vuln[test,lint,release]"]

[project.urls]
Repository = "https://github.com/samy-difallah/maat-vuln"
Issues = "https://github.com/samy-difallah/maat-vuln/issues"

[tool.hatch.build.targets.wheel]
packages = ["maat_vuln"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "ANN",     # type annotations
    "UP",      # pyupgrade (PEP 585/604 generics and unions)
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "PT",      # flake8-pytest-style
    "RUF",     # ruff-specific
    "T20",     # no print: the library never writes to the terminal
    "PLR2004", # thresholds are named constants, not inline literals
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.importlinter]
root_packages = ["maat_vuln", "tests"]

# A plain "maat_vuln" source would skip the subpackage's own descendants,
# hence the wildcard; imports inside the subpackage are allowed.
[[tool.importlinter.contracts]]
name = "Import models from maat_vuln.models, not its submodules"
type = "forbidden"
source_modules = ["maat_vuln.*", "tests"]
forbidden_modules = [
    "maat_vuln.models.finding",
    "maat_vuln.models.input",
    "maat_vuln.models.report",
    "maat_vuln.models.signals",
]
ignore_imports = [
    "maat_vuln.models -> maat_vuln.models.*",
    "maat_vuln.models.** -> maat_vuln.models.*",
]

[[tool.importlinter.contracts]]
name = "Import policy from maat_vuln.policy, not its submodules"
type = "forbidden"
source_modules = ["maat_vuln.*", "tests"]
forbidden_modules = ["maat_vuln.policy.default"]
ignore_imports = ["maat_vuln.policy -> maat_vuln.policy.*"]

[[tool.importlinter.contracts]]
name = "Import snapshot from maat_vuln.snapshot, not its submodules"
type = "forbidden"
source_modules = ["maat_vuln.*", "tests"]
forbidden_modules = ["maat_vuln.snapshot.store"]
ignore_imports = ["maat_vuln.snapshot -> maat_vuln.snapshot.*"]

[[tool.importlinter.contracts]]
name = "Import feeds from maat_vuln.feeds, not its submodules"
type = "forbidden"
source_modules = ["maat_vuln.*", "tests"]
forbidden_modules = ["maat_vuln.feeds.http"]
ignore_imports = ["maat_vuln.feeds -> maat_vuln.feeds.*"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--cov=maat_vuln",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["maat_vuln"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}**breaking**: {% endif %}\
{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\
"""
trim = false

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# The HTML comments only fix the section order; striptags drops them.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 00 -->Features" },
    { message = "^fix", group = "<!-- 01 -->Bug fixes" },
    { message = "^perf", group = "<!-- 02 -->Performance" },
    { message = "^refactor", group = "<!-- 03 -->Refactoring" },
    { message = "^revert", group = "<!-- 04 -->Reverts" },
    { message = "^docs", group = "<!-- 05 -->Documentation" },
    { message = "^test", group = "<!-- 06 -->Tests" },
    { message = "^build", group = "<!-- 07 -->Build" },
    { message = "^ci", group = "<!-- 08 -->CI" },
    { message = "^style", group = "<!-- 09 -->Style" },
    { message = "^chore", group = "<!-- 10 -->Miscellaneous" },
]

[tool.git-cliff.bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
